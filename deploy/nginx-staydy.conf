# Staydy nginx — reverse proxy for the 3 SSR frontends + the API. Put this at
# /etc/nginx/sites-available/staydy.uz, symlink into sites-enabled, then run certbot (it rewrites
# these HTTP blocks to add HTTPS + a 80→443 redirect):
#   sudo certbot --nginx -d staydy.uz -d www.staydy.uz -d app.staydy.uz -d admin.staydy.uz -d api.staydy.uz
#
# All upstreams listen on 127.0.0.1 (published by docker-compose.prod.yml).

# Shared proxy settings for the SSR node apps.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# --- Landing: staydy.uz ---
server {
    listen 80;
    server_name staydy.uz www.staydy.uz;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}

# --- Center app: app.staydy.uz ---
server {
    listen 80;
    server_name app.staydy.uz;
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}

# --- Superadmin: admin.staydy.uz ---
server {
    listen 80;
    server_name admin.staydy.uz;
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}

# --- Student mini app: student.staydy.uz ---
server {
    listen 80;
    server_name student.staydy.uz;
    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}

# --- API: api.staydy.uz ---
server {
    listen 80;
    server_name api.staydy.uz;
    client_max_body_size 12m; # CSV import uploads
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
