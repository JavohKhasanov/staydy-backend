# Production stack: everything on one server, behind the host's nginx (which does TLS + routing).
# Run from this directory with the 3 frontend repos as SIBLINGS of this one:
#   /opt/staydy/staydy-backend      (this repo — run compose from here)
#   /opt/staydy/staydy-website      (landing)
#   /opt/staydy/staydy-app          (center app — admin + teacher, role-based)
#   /opt/staydy/staydy-superadmin   (platform-owner panel)
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Ports are bound to 127.0.0.1 only — nothing is exposed publicly except through nginx.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ssp
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ssp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssp"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # No published port: Postgres is reachable only inside this compose network.

  # Applies Atlas migrations as the superuser (creates the RLS "app" role, tables, policies) and exits.
  migrate:
    image: arigaio/atlas:latest
    command:
      - migrate
      - apply
      - --url
      - postgres://ssp:${DB_PASSWORD}@postgres:5432/ssp?sslmode=disable
      - --dir
      - file:///migrations
    volumes:
      - ./db/migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    env_file: .env
    environment:
      # The app connects as the non-superuser "app" role so Postgres RLS is enforced (FORCE RLS).
      # Postgres isn't public, so the internal app:app credential is fine; rotate it if you wish.
      DATABASE_URL: postgres://app:app@postgres:5432/ssp?sslmode=disable
    ports:
      # Bound to the docker0 gateway so Nginx Proxy Manager (a container) reaches it via 172.17.0.1;
      # not publicly exposed. Host port avoids the existing 808x/3000 services on this box.
      - "172.17.0.1:8090:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  landing:
    build:
      context: ../staydy-website
      args:
        VITE_API_BASE_URL: "https://api.staydy.uz/api/v1"
    ports:
      - "172.17.0.1:3010:3000"
    restart: unless-stopped

  app:
    build:
      context: ../staydy-app
      args:
        VITE_API_BASE_URL: "https://api.staydy.uz/api/v1"
    ports:
      - "172.17.0.1:3011:3000"
    restart: unless-stopped

  admin:
    build:
      context: ../staydy-superadmin
      args:
        VITE_API_BASE_URL: "https://api.staydy.uz/api/v1"
    ports:
      - "172.17.0.1:3012:3000"
    restart: unless-stopped

  # Student mini app (Telegram + web). Point the proxy host talaba.staydy.uz → 172.17.0.1:3013.
  student:
    build:
      context: ../staydy-student
      args:
        VITE_API_BASE_URL: "https://api.staydy.uz/api/v1"
    ports:
      - "172.17.0.1:3013:3000"
    restart: unless-stopped

  # Automated database backups: a compressed pg_dump on start and then daily, kept 14 days, written
  # to ./backups on the host (outside the pgdata volume). Restore with:
  #   gunzip -c backups/ssp-YYYYmmdd-HHMMSS.sql.gz | docker compose -f docker-compose.prod.yml exec -T postgres psql -U ssp -d ssp
  # NOTE: these live on the same server as the DB — copy them off-box (rsync/S3) for real disaster
  # recovery. The dump uses the .tmp→rename trick so a partial file is never picked up as a backup.
  backup:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - ./backups:/backups
    command: >
      sh -c 'echo "backup service: initial dump then daily, 14-day retention";
      while true; do
      ts=$$(date +%Y%m%d-%H%M%S);
      if PGPASSWORD="$$DB_PASSWORD" pg_dump -h postgres -U ssp -d ssp | gzip > /backups/ssp-$$ts.sql.gz.tmp;
      then mv /backups/ssp-$$ts.sql.gz.tmp /backups/ssp-$$ts.sql.gz; echo "backup ok ssp-$$ts.sql.gz";
      else echo "backup FAILED $$ts"; rm -f /backups/ssp-$$ts.sql.gz.tmp; fi;
      find /backups -name "ssp-*.sql.gz" -mtime +14 -delete;
      sleep 86400; done'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
